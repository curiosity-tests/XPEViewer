  publish-release:
    runs-on: ubuntu-latest
    needs:
    - build-ubuntu-24
    - build-ubuntu-24-arm
    - build-ubuntu-22
    permissions:
      id-token: write
      contents: write
    steps:
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets
        merge-multiple: true

    - name: Upload Release as Download
      continue-on-error: true     # racecar: scan/report/push step, must not fail the build
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.RELEASE_TOKEN || github.token }}
        tag_name: Beta
        target_commitish: ${{ github.sha }}
        draft: false
        prerelease: true
        fail_on_unmatched_files: true
        files: |
          release-assets/*
